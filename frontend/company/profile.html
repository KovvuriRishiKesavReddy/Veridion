<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Profile — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container" style="max-width:520px;">
  <div class="card p-4">
    <h4 class="mb-1">Company Profile</h4>
    <p class="text-muted small">Company name and address can be updated any time. GSTIN was verified by Platform Admin against your registration proof and can't be self-edited here.</p>
    <div class="mb-3"><label class="form-label">Company Name</label><input type="text" class="form-control" id="profile_name"></div>
    <div class="mb-3">
      <label class="form-label">GSTIN</label>
      <input type="text" class="form-control" id="profile_gstin" disabled>
      <div class="form-text">GSTIN is verified by Platform Admin and can't be self-edited. Contact the platform if this needs correcting.</div>
    </div>
    <div class="mb-3"><label class="form-label">Address</label><input type="text" class="form-control" id="profile_address"></div>
    <div class="mb-3"><label class="form-label">Industry Type</label><input type="text" class="form-control" id="profile_industry_type"></div>
    <div class="mb-3">
      <label class="form-label">Approval Status</label><br>
      <span class="badge status-badge" id="profile_approval_status"></span>
    </div>
    <button class="btn btn-amber w-100" onclick="saveProfile()">Save Changes</button>
    <div id="profileSavedMsg" class="text-success small mt-2 d-none">Saved.</div>
  </div>
</div>

<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['company_admin']);

async function loadProfile() {
  const res = await fetchWithAuth('/api/company/profile');
  if (!res) return;
  const p = await res.json();
  document.getElementById('profile_name').value = p.name || '';
  document.getElementById('profile_gstin').value = p.gstin || '';
  document.getElementById('profile_address').value = p.address || '';
  document.getElementById('profile_industry_type').value = p.industry_type || '';
  const statusEl = document.getElementById('profile_approval_status');
  statusEl.textContent = p.approval_status || '—';
  statusEl.className = 'badge status-badge ' + statusBadgeClass(p.approval_status);
}
loadProfile();

async function saveProfile() {
  const body = {
    name: document.getElementById('profile_name').value,
    address: document.getElementById('profile_address').value,
    industry_type: document.getElementById('profile_industry_type').value,
  };
  const res = await fetchWithAuth('/api/company/profile', { method: 'PUT', body: JSON.stringify(body) });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return; }
  const msg = document.getElementById('profileSavedMsg');
  msg.classList.remove('d-none');
  setTimeout(() => msg.classList.add('d-none'), 2000);
}
</script>
</body>
</html>
