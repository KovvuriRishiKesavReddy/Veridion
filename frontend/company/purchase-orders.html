<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchase Orders — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-4">Purchase Orders</h3>
  <div id="sortToolbar"></div>
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6 class="mb-0">Purchase Orders</h6>
    <div id="viewToggle"></div>
  </div>
  <div class="view-wrap" id="viewWrap">
    <div id="cards" class="row g-3 view-cards"></div>
  </div>
</div>

<div class="modal fade" id="poModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">PO Fulfillment</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="poModalBody">Loading...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script src="/shared/seg-toggle.js"></script>
<script>
const user = requireLogin(['procurement', 'finance', 'warehouse']);
let poModal;
let getSortState = () => ({ sortBy: 'newest' });
// Pending = not fully delivered yet (partially fulfilled ones keep their own badge); Fulfilled = fully
// delivered. Same sliding toggle and swap as the Team page (shared/seg-toggle.js).
const viewToggle = createViewToggle({
  mountId: 'viewToggle', wrapId: 'viewWrap', tableId: 'cards',
  views: [{ key: 'pending', label: 'Pending' }, { key: 'fulfilled', label: 'Fulfilled' }],
  initial: 'pending',
  onSwap: () => { renderPos(); }
});
const EMPTY_MSG = {
  pending: 'No pending purchase orders.',
  fulfilled: 'No fulfilled purchase orders yet. An order moves here once everything has been delivered.'
};
document.addEventListener('DOMContentLoaded', () => {
  poModal = new bootstrap.Modal(document.getElementById('poModal'));
  getSortState = renderSortToolbar('sortToolbar', load, {
    searchPlaceholder: 'Search by requirement or vendor...',
    sortOptions: [
      { value: 'text:requirement_title', label: 'Requirement: A → Z' },
      { value: 'text:vendor_name', label: 'Vendor: A → Z' }
    ]
  });
  // Poll every second so fulfillment status updates live as GRNs are recorded.
  // Pauses while any PO detail is being selected/copied.
  pollEvery(load, 1000, () => pollBlockedBy('cards'));
});

async function load() {
  const res = await fetchWithAuth('/api/purchase-orders/mine');
  if (!res) return;
  let pos = await res.json();
  lastPos = sortAndFilterItems(pos, getSortState(), { dateField: 'created_at', numberField: 'id', searchFields: ['requirement_title', 'vendor_name'] });
  renderPos();
}

function renderPos() {
  const isFulfilled = po => po.fulfillment_status === 'fulfilled';
  viewToggle.setCounts({ pending: lastPos.filter(po => !isFulfilled(po)).length, fulfilled: lastPos.filter(isFulfilled).length });
  // Never write cards while the grid is fading out for a view switch.
  if (viewToggle.isSwapping()) return;
  const view = viewToggle.getView();
  const pos = lastPos.filter(po => (view === 'fulfilled') === isFulfilled(po));
  const cards = document.getElementById('cards');
  if (!pos.length) { setHtmlPreserving(cards, `<p class="text-muted">${lastPos.length ? EMPTY_MSG[view] : 'No purchase orders yet.'}</p>`); return; }

  const isWarehouse = user.role === 'warehouse';
  // Post-award, only Warehouse converses with the vendor (logistics). Procurement can open the same
  // thread as read-only history; Finance has no thread (the server refuses it by role), so no button.
  const canMessage = user.role === 'warehouse';
  const canViewThread = user.role === 'procurement';
  setHtmlPreserving(cards, pos.map(po => `
    <div class="col-md-6">
      <div class="card p-3">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h6 class="mb-1">PO #${po.id} — ${po.requirement_title}</h6>
            <p class="small text-muted mb-1">Vendor: ${po.vendor_name}</p>
            ${isWarehouse ? '' : `<p class="small text-muted mb-1">Agreed Price: ₹${po.agreed_price}</p>`}
            <p class="small text-muted mb-1">Qty: ${qtyWithUnit(po.agreed_quantity, po.unit)} · Agreed Delivery Date: <strong>${po.agreed_delivery_date ? po.agreed_delivery_date.slice(0,10) : '—'}</strong></p>
          </div>
          <div class="text-end">
            <span class="badge status-badge ${statusBadgeClass(po.status)} d-block mb-1">${po.status}</span>
            <span class="badge status-badge ${statusBadgeClass(po.fulfillment_status)}">${po.fulfillment_status}</span>
          </div>
        </div>
        <div class="mt-2 d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary" onclick="viewDetails(${po.id})">View Fulfillment</button>
          ${po.po_document_path && !isWarehouse ? `<button class="btn btn-sm btn-amber" onclick="downloadPo(${po.id})">Download PO PDF</button>` : ''}
          ${canMessage ? `<button class="btn btn-sm btn-message" onclick="openPoThread(${po.id})">Message Vendor</button>` : ''}
          ${canViewThread ? `<button class="btn btn-sm btn-outline-secondary" onclick="openPoThread(${po.id})">Message History</button>` : ''}
        </div>
      </div>
    </div>`).join(''));
}

// Post-award conversation with the vendor (logistics only -- price is locked on the PO).
// Warehouse posts; Procurement sees the same history read-only. The reply box is disabled, not the
// button, once an invoice on the PO is paid: the history stays readable.
let lastPos = [];
function openPoThread(id) {
  const po = lastPos.find(p => p.id === id);
  openThreadModal({
    title: `PO #${id}${po ? ' — ' + po.requirement_title : ''}`,
    subtitle: po ? `Conversation between Warehouse and ${po.vendor_name} · logistics only, the agreed price is locked` : 'Logistics only',
    readOnly: user.role === 'procurement',
    readOnlyNote: 'Read-only — after the quotation is accepted, delivery conversations with the vendor are handled by Warehouse. You can follow the full history here.',
    listUrl: `/api/po-messages/${id}`,
    postUrl: `/api/po-messages/${id}`,
    statusUrl: `/api/po-messages/${id}/status`,
    viewerRole: user.role,
    placeholder: 'Message the vendor...',
    closedNote: 'This purchase order has been paid — the conversation is closed to new messages, history stays visible.'
  });
}

async function viewDetails(id) {
  poModal.show();
  const body = document.getElementById('poModalBody');
  body.innerHTML = 'Loading...';
  const res = await fetchWithAuth(`/api/purchase-orders/${id}/grns`);
  if (!res) return;
  const data = await res.json();
  if (!res.ok) { body.innerHTML = `<p class="text-danger">${data.error}</p>`; return; }

  const received = data.grns.reduce((sum, g) => sum + Number(g.received_quantity), 0);
  const unit = data.unit;
  body.innerHTML = `
    <p><strong>PO #${data.po_id}</strong> — Agreed Quantity: ${qtyWithUnit(data.agreed_quantity, unit)} · Status: <span class="badge status-badge ${statusBadgeClass(data.fulfillment_status)}">${data.fulfillment_status}</span></p>
    <p>Total Received So Far: <strong>${qtyWithUnit(received, unit)} / ${qtyWithUnit(data.agreed_quantity, unit)}</strong></p>
    ${data.grns.length ? `
    <table class="table table-centered table-sm">
      <thead><tr><th>Date</th><th>Qty Received</th><th>Quality</th><th>Recorded Notes</th><th>Next Expected</th></tr></thead>
      <tbody>
        ${data.grns.map(g => `
          <tr class="${g.voided_at ? 'text-muted' : ''}">
            <td>${g.received_date}</td>
            <td>${g.voided_at ? `<s>${qtyWithUnit(g.received_quantity, unit)}</s> <span class="badge bg-secondary">Voided</span>` : `${qtyWithUnit(g.received_quantity, unit)}${varianceBadge(g.variance_quantity)}`}</td>
            <td>${qualityBadge(g.quality_rating, g.quality_notes)}</td>
            <td>${g.warehouse_notes || '—'}</td>
            <td>${g.expected_next_delivery_date || '—'}${g.next_delivery_notes ? `<br><span class="small text-muted">${escapeHtml(g.next_delivery_notes)}</span>` : ''}${g.source_message_text ? `<div class="small text-muted fst-italic">— from conversation: "${escapeHtml(g.source_message_text)}" (${escapeHtml(g.source_message_sender)})</div>` : ''}</td>
          </tr>`).join('')}
      </tbody>
    </table>` : '<p class="text-muted">No goods receipt notes recorded yet for this PO.</p>'}
  `;
}

async function downloadPo(id) {
  const res = await fetchWithAuth(`/api/purchase-orders/${id}/document`);
  if (!res || !res.ok) { alert('Could not fetch document'); return; }
  const blob = await res.blob();
  window.open(URL.createObjectURL(blob), '_blank');
}
</script>
</body>
</html>
