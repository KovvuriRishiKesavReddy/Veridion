<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Review — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
<style>
  .confidence-high { background:#198754; color:#fff; }
  .confidence-medium { background:#ffc107; color:#1a1a1a; }
  .confidence-low { background:#dc3545; color:#fff; }
</style>
</head>
<body>
<div id="navbar-root"></div>
<div class="container" style="max-width:900px;">
  <a href="/company/invoices.html" class="small">&larr; Back to Invoices</a>
  <div id="content"><p class="text-muted mt-3">Loading...</p></div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
const user = requireLogin(['finance']);
const invoiceId = new URLSearchParams(window.location.search).get('id');

function confidenceLabel(decision) {
  if (!decision || !decision.agent_inputs || !decision.gate_weights) return { label: 'Unknown', cls: 'confidence-low' };
  const inputs = decision.agent_inputs;
  const weights = decision.gate_weights;
  let aggregate = 0;
  for (const agent in weights) {
    aggregate += (weights[agent] || 0) * (inputs[agent]?.confidence || 0);
  }
  if (aggregate >= 0.8) return { label: 'High', cls: 'confidence-high', value: aggregate };
  if (aggregate >= 0.5) return { label: 'Medium', cls: 'confidence-medium', value: aggregate };
  return { label: 'Low', cls: 'confidence-low', value: aggregate };
}

async function load() {
  const res = await fetchWithAuth(`/api/invoices/${invoiceId}/review`);
  if (!res) return;
  const data = await res.json();
  const content = document.getElementById('content');
  if (!res.ok) { content.innerHTML = `<p class="text-danger mt-3">${data.error}</p>`; return; }

  const { invoice, document_extraction, matching_result, compliance_check, decision, fraud_flags, vendor_risk } = data;
  const conf = confidenceLabel(decision);

  content.innerHTML = `
    <h3 class="mt-3 mb-1">Invoice #${invoice.invoice_number || invoice.id} <span class="badge status-badge ${statusBadgeClass(invoice.status)}">${invoice.status}</span></h3>
    <p class="text-muted">${invoice.requirement_title} · ${invoice.vendor_name} · PO #${invoice.po_id}</p>
    <p class="mb-3"><strong>Amount to Pay: ₹${invoiceTotal(invoice)}</strong> <span class="text-muted small">(₹${invoice.invoice_amount} + ₹${invoice.gst_amount || 0} GST)</span></p>

    ${decision ? `
    <div class="card p-3 mb-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">System Decision: <span class="badge status-badge ${statusBadgeClass(decision.final_decision === 'auto_approved' ? 'verified' : 'flagged')}">${decision.final_decision}</span></h5>
        <span class="badge ${conf.cls}">System confidence: ${conf.label}</span>
      </div>
      <p class="mb-1"><strong>Final score:</strong> ${Number(decision.final_score).toFixed(2)}</p>
      <p class="mb-2">${decision.reasoning_text}</p>
      <details class="small text-muted">
        <summary>Show gate weights and agent inputs</summary>
        <pre class="mt-2">${JSON.stringify({ gate_weights: decision.gate_weights, agent_inputs: decision.agent_inputs }, null, 2)}</pre>
      </details>
    </div>` : `<div class="alert alert-secondary">AI verification hasn't run yet for this invoice — check back shortly, or confirm the ai-service and RabbitMQ are running.</div>`}

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h6>Semantic Matching</h6>
          ${matching_result ? `
            <p class="mb-1">Overall match: <span class="badge ${matching_result.overall_match ? 'bg-success' : 'bg-danger'}">${matching_result.overall_match ? 'Yes' : 'No'}</span></p>
            <p class="mb-1 small">Issue type: ${matching_result.issue_type}</p>
            <p class="mb-1 small">Confidence: ${Number(matching_result.confidence_score).toFixed(2)} · Data volume: ${matching_result.data_volume}</p>
            ${Object.keys(matching_result.mismatch_fields || {}).length ? `<pre class="small mt-2">${JSON.stringify(matching_result.mismatch_fields, null, 2)}</pre>` : '<p class="small text-success mb-0">No mismatched fields.</p>'}
          ` : '<p class="text-muted small">Not yet run.</p>'}
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h6>Compliance</h6>
          ${compliance_check ? `
            <p class="mb-1">GST valid: <span class="badge ${compliance_check.gst_valid ? 'bg-success' : 'bg-danger'}">${compliance_check.gst_valid ? 'Yes' : 'No'}</span></p>
            <p class="mb-1 small">Rate used: ${(compliance_check.gst_rate_used * 100).toFixed(0)}% as of ${compliance_check.gst_rate_reference_date}</p>
            ${compliance_check.issues_found?.length ? `<ul class="small mb-0">${compliance_check.issues_found.map(i => `<li>${i}</li>`).join('')}</ul>` : '<p class="small text-success mb-0">No issues found.</p>'}
          ` : '<p class="text-muted small">Not yet run.</p>'}
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h6>Fraud Detection</h6>
          ${fraud_flags && fraud_flags.length ? `
            <p class="mb-1">Flags found: <span class="badge bg-danger">${fraud_flags.length}</span></p>
            <ul class="small mb-0">${fraud_flags.map(f => `<li>${f.flag_type} (${f.severity})${f.resolved ? ' — resolved' : ''}</li>`).join('')}</ul>
          ` : '<p class="small text-success mb-0">No fraud signals found.</p>'}
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h6>Vendor Risk (this company's history with this vendor)</h6>
          ${decision && decision.agent_inputs?.vendor_risk ? `
            <p class="mb-1 small"><strong>At the time of this decision:</strong> data volume ${decision.agent_inputs.vendor_risk.data_volume} event(s), invoice accuracy ${(decision.agent_inputs.vendor_risk.verdict_score * 100).toFixed(2)}% — this is exactly what the reasoning above and the gate weights are based on.</p>
          ` : ''}
          ${vendor_risk ? `
            <p class="mb-1 small"><strong>Current status:</strong> data volume ${vendor_risk.data_volume} event(s)${vendor_risk.data_source === 'self_reported' ? ' <span class="badge bg-secondary">includes self-reported legacy data</span>' : ''}</p>
            <p class="mb-1 small">On-time delivery: ${vendor_risk.on_time_delivery_pct != null ? Number(vendor_risk.on_time_delivery_pct).toFixed(0) + '%' : 'N/A'}</p>
            <p class="mb-0 small">Invoice accuracy: ${vendor_risk.invoice_accuracy_pct != null ? Number(vendor_risk.invoice_accuracy_pct).toFixed(2) + '%' : 'N/A'}</p>
            ${decision && decision.agent_inputs?.vendor_risk && Number(vendor_risk.data_volume) !== decision.agent_inputs.vendor_risk.data_volume ? `<p class="mb-0 small text-muted">(Current numbers differ from the decision above because at least one more event — a delivery, another invoice decision, or a resolved dispute — has been recorded for this vendor since.)</p>` : ''}
          ` : '<p class="small text-muted mb-0">No history yet with this vendor — cold start, carries little weight in the decision until real events accumulate.</p>'}
        </div>
      </div>
    </div>

    <div class="card p-3 mb-4">
      <h6>Document Extraction (OCR / Structuring)</h6>
      ${document_extraction ? `
        <p class="small mb-1">Confidence: ${Number(document_extraction.confidence_score).toFixed(2)}${document_extraction.structured_data?.__source === 'vendor_submitted_fallback' ? ' <span class="text-muted">(no scanned document — structured from vendor-submitted fields)</span>' : ''}</p>
        <pre class="small">${JSON.stringify(document_extraction.structured_data, null, 2)}</pre>
      ` : '<p class="text-muted small">Not yet run.</p>'}
    </div>

    ${data.overrides && data.overrides.length ? `
    <div class="alert alert-secondary">
      <strong>Override history:</strong>
      ${data.overrides.map(o => `<div class="small mt-1">Paid despite being flagged, by ${o.overridden_by_name} on ${new Date(o.overridden_at).toLocaleDateString()} — "${o.reason}"</div>`).join('')}
    </div>` : ''}

    ${invoice.status !== 'paid' ? (
      user.role !== 'finance' ? `<span class="small text-muted">Only Finance can approve payment.</span>` :
      decision && decision.final_decision === 'auto_approved' ? `<span class="hbg d-inline-block"><button class="hbg-core" onclick="withButtonState(this, () => markPaid())">Approve Payment</button></span>` :
      decision ? `<span class="hbg hbg-danger d-inline-block"><button class="hbg-core" onclick="withButtonState(this, () => overrideAndPay())">Override &amp; Approve Payment Anyway</button></span>
        <p class="small text-muted mt-1">This was ${decision.final_decision} by verification — approving anyway requires a reason, which is kept on record.</p>` :
      `<span class="small text-muted">Waiting on AI verification.</span>`
    ) : `<span class="badge bg-success">Already Paid</span>`}
  `;
}

async function markPaid() {
  const ok = await confirmDialog({
    title: 'Approve payment?',
    message: 'This releases payment for this invoice. The system only recommends — this is your decision.',
    confirmText: 'Approve Payment'
  });
  if (!ok) return null;
  const res = await fetchWithAuth(`/api/invoices/${invoiceId}/mark-paid`, { method: 'POST' });
  if (!res) return false;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return false; }
  load();
}

async function overrideAndPay() {
  const reason = await promptDialog({
    title: 'Override the flag and pay anyway?',
    message: 'This invoice was flagged by verification. Enter a reason for approving payment anyway — it is kept on the audit record.',
    placeholder: 'e.g. Confirmed correct after checking with the vendor directly.',
    confirmText: 'Override & Pay'
  });
  if (!reason) return null;
  const res = await fetchWithAuth(`/api/invoices/${invoiceId}/override-and-pay`, { method: 'POST', body: JSON.stringify({ reason }) });
  if (!res) return false;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return false; }
  load();
}

// Poll every second so the decision/status updates live if the AI pipeline finishes
// processing while this page is open, or if Finance approves payment in another tab.
// Pauses while the "agent weights" details panel is open or its content is being
// selected/copied.
pollEvery(load, 1000, () => pollBlockedBy('content'));
</script>
</body>
</html>
