<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRN Documents — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-1">GRN Documents</h3>
  <p class="text-muted">Every goods receipt note recorded across the company, with how much of each order has been fulfilled so far. No pricing appears here — this view is quantity-only, by design.</p>
  <div id="sortToolbar"></div>
  <table class="table bg-white">
    <thead><tr><th>PO</th><th>Vendor</th><th>Received Qty / Agreed Qty</th><th>Received Date</th><th>Fulfillment</th><th>Recorded By</th><th>Next Expected</th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
  </table>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['procurement', 'finance', 'warehouse']);
let getSortState = () => ({ sortBy: 'newest' });

async function load() {
  const res = await fetchWithAuth('/api/grn/company');
  if (!res) return;
  let grns = await res.json();
  grns = sortAndFilterItems(grns, getSortState(), { dateField: 'received_date', numberField: 'id' });
  const rows = document.getElementById('rows');
  if (!grns.length) { rows.innerHTML = '<tr><td colspan="7" class="text-muted">No GRNs recorded yet.</td></tr>'; return; }
  rows.innerHTML = grns.map(g => `
    <tr>
      <td>#${g.po_id} — ${g.requirement_title}</td>
      <td>${g.vendor_name}</td>
      <td>${g.cumulative_received} / ${g.agreed_quantity}${varianceBadge(g.variance_quantity)}<div class="small text-muted">this delivery: ${g.received_quantity}</div></td>
      <td>${g.received_date}</td>
      <td><span class="badge status-badge ${statusBadgeClass(g.fulfillment_status)}">${g.fulfillment_status}</span></td>
      <td>${g.recorded_by_name}</td>
      <td>${g.expected_next_delivery_date || '—'}${g.next_delivery_notes ? `<br><span class="small text-muted">${g.next_delivery_notes}</span>` : ''}</td>
    </tr>`).join('');
}
getSortState = renderSortToolbar('sortToolbar', load);
// Poll every second so a new GRN recorded by Warehouse shows up live.
pollEvery(load, 1000, () => pollBlockedBy('rows'));
</script>
</body>
</html>
