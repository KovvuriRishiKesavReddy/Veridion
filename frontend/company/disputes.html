<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disputes — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-1">Vendor Disputes</h3>
  <p class="text-muted">AI-drafted dispute messages for flagged invoices, and verification requests for invoices under fraud review — review, edit if needed, then send to the vendor.</p>
  <div id="sortToolbar"></div>

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4 mb-2">
    <div>
      <h6 class="mb-0" id="viewTitle">Pending — needs your review</h6>
      <div class="small text-muted" id="viewCaption"></div>
    </div>
    <div id="viewToggle"></div>
  </div>
  <div class="view-wrap" id="viewWrap">
    <div id="list" class="view-cards"><p class="text-muted">Loading...</p></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script src="/shared/seg-toggle.js"></script>
<script>
requireLogin(['finance']);
let getSortState = () => ({ sortBy: 'newest' });
// Tracks the message count we've already seen per dispute, so we only toast on a
// GENUINELY new vendor message, not on every poll tick that happens to re-fetch the
// same messages again.
let seenMessageCounts = {};
let firstLoad = true;

// Pausing the poll only for an active text selection isn't quite enough for a
function card(c, actionsHtml) {
  const isFraudReview = c.final_decision === 'suspicious';
  // Combine the old single-field response (from before the message-thread change) with
  // the new individual messages, in one chronological, scrollable conversation — this
  // is deliberately the SAME layout for a flagged mismatch and a fraud-review dispute,
  // so both look and behave identically to Finance; only the "Fraud Review" badge
  // above differs.
  const thread = buildDisputeThread(c, c.vendor_name);
  const canMessage = c.status === 'sent' && !c.resolved;
  return `
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <strong>${c.vendor_name}</strong> — Invoice ${c.invoice_number || '#' + c.invoice_id} (₹${c.invoice_amount ?? '—'})
          <div class="text-muted small">${c.requirement_title || ''}${c.requirement_title ? ' · ' : ''}${c.mismatch_type || 'other'}${isFraudReview ? ' <span class="badge bg-danger ms-1">Fraud Review</span>' : ''}${c.invoice_withdrawn ? ' <span class="badge bg-secondary ms-1">Invoice Withdrawn</span>' : ''}</div>
        </div>
        <span class="badge status-badge ${statusBadgeClass(c.status)}">${c.status}</span>
      </div>
      ${c.status === 'pending_send' ? `
      <div class="mt-2">
        <label class="form-label small text-muted mb-1">Draft message — edit, then send to the vendor</label>
        <textarea class="form-control" id="msg-${c.id}" rows="5">${escapeHtml(c.draft_text)}</textarea>
      </div>` : ''}
      ${thread.length ? `
      <div class="mt-2">
        <label class="form-label small text-muted mb-1">Conversation</label>
        <div class="dispute-thread" data-scroll-key="thread-${c.id}">
          ${renderChatThread(thread, 'finance')}
        </div>
      </div>` : ''}
      ${canMessage ? `
      <div class="mt-2">
        <textarea class="form-control" id="fmsg-${c.id}" rows="2" placeholder="Message the vendor..."></textarea>
      </div>` : ''}
      ${c.resolved ? `<div class="alert alert-success mt-2 mb-0 small">Resolved on ${new Date(c.resolved_at).toLocaleString()} — took ${Number(c.resolution_time_hours).toFixed(1)} hour(s).</div>` : ''}
      <div class="dispute-actions mt-3">
        ${canMessage ? `<span class="hbg d-inline-block"><button class="hbg-core dispute-btn" onclick="withButtonState(this, () => sendMessage(${c.id}))">Send Message</button></span>` : ''}
        ${actionsHtml}
      </div>
    </div>`;
}

// resolvedCard: a deliberately compact summary for the Resolved list — just enough to
// confirm "yes, this was dealt with," per request: vendor name, invoice number, and
// when it was resolved. Uses invoice_number/vendor_name's snapshot fallback, so this
// keeps working even after the vendor withdraws the invoice to resubmit a corrected
// one (which used to wipe the dispute record out entirely — it no longer does).
function resolvedCard(c) {
  const isFraudReview = c.final_decision === 'suspicious';
  return `
    <div class="card p-2 px-3 mb-2">
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div class="small">
          <strong>${c.vendor_name}</strong> — Invoice ${c.invoice_number || '#' + c.invoice_id}
          ${isFraudReview ? '<span class="badge bg-danger ms-1">Fraud Review</span>' : ''}
          ${c.invoice_withdrawn ? '<span class="badge bg-secondary ms-1">Invoice Withdrawn</span>' : ''}
        </div>
        <div class="small text-muted">Resolved ${new Date(c.resolved_at).toLocaleString()}</div>
      </div>
    </div>`;
}

// closedCard: compact card for disputes closed automatically (payment / withdrawal).
function closedCard(c, message) {
  return `
    <div class="card p-2 px-3 mb-2">
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div class="small">
          <strong>${c.vendor_name}</strong> — Invoice ${c.invoice_number || '#' + c.invoice_id}
          <div class="text-muted">${message}${c.status === 'pending_send' ? ' (Draft was never sent to the vendor.)' : ''}</div>
        </div>
        <div class="small text-muted">${new Date(c.resolved_at).toLocaleString()}</div>
      </div>
    </div>`;
}

async function sendMessage(id) {
  const textarea = document.getElementById(`fmsg-${id}`);
  const message = textarea.value;
  if (!message || !message.trim()) { alert('Please enter a message first.'); return false; }
  const res = await fetchWithAuth(`/api/vendor-communications/${id}/message`, { method: 'POST', body: JSON.stringify({ message }) });
  if (!res) return false;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return false; }
  textarea.value = '';
  loadAll();
}

async function saveEdit(id) {
  const draft_text = document.getElementById(`msg-${id}`).value;
  const res = await fetchWithAuth(`/api/vendor-communications/${id}`, { method: 'PUT', body: JSON.stringify({ draft_text }) });
  if (!res) return false;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return false; }
  // No alert() here — the button's own loading -> success animation already
  // confirms the save; a blocking dialog on top of that would just be noise.
}

async function sendDispute(id) {
  const ok = await confirmDialog({
    title: 'Send this message to the vendor?',
    message: 'Once sent, the vendor can see it and respond — you can still send follow-up messages afterward, but this exact wording is what they\'ll see first.',
    confirmText: 'Send to Vendor'
  });
  if (!ok) return null;
  await saveEdit(id);
  const res = await fetchWithAuth(`/api/vendor-communications/${id}/send`, { method: 'POST' });
  if (!res) return false;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return false; }
  loadAll();
}

async function resolveDispute(id) {
  const ok = await confirmDialog({
    title: 'Mark this dispute as resolved?',
    message: 'This is recorded permanently and feeds this vendor\'s dispute-rate score.',
    confirmText: 'Mark Resolved'
  });
  if (!ok) return null;
  const res = await fetchWithAuth(`/api/vendor-communications/${id}/resolve`, { method: 'POST' });
  if (!res) return false;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return false; }
  loadAll();
}
async function loadAll() {
  const res = await fetchWithAuth('/api/vendor-communications');
  if (!res) return;
  let all = await res.json();
  all = sortAndFilterItems(all, getSortState(), { dateField: 'created_at', numberField: 'id', searchFields: ['vendor_name', 'invoice_number', 'requirement_title', 'mismatch_type'] });

  // New-vendor-message notification: compare this poll's message counts per dispute
  // against what we last saw. Skipped on the very first load (nothing to compare
  // against yet — that would toast for the vendor's entire message history).
  if (!firstLoad) {
    all.forEach(c => {
      const vendorMessageCount = (c.messages || []).filter(m => m.sender_role === 'vendor').length;
      const prevCount = seenMessageCounts[c.id] || 0;
      if (vendorMessageCount > prevCount) {
        showToast(`New message from ${c.vendor_name} on Invoice ${c.invoice_number || '#' + c.invoice_id}`);
      }
    });
  }
  all.forEach(c => { seenMessageCounts[c.id] = (c.messages || []).filter(m => m.sender_role === 'vendor').length; });
  firstLoad = false;

  allDisputes = all;
  renderDisputes();
}

// One list, five tabs. Same sliding toggle and swap as the Team page (shared/seg-toggle.js).
let allDisputes = [];
const VIEW_INFO = {
  pending:   { title: 'Pending — needs your review', caption: '' },
  sent:      { title: 'Sent — awaiting resolution', caption: '' },
  resolved:  { title: 'Resolved', caption: '' },
  accepted:  { title: 'Finance Accepted', caption: "Disputes closed automatically because the invoice was paid or auto-approved — nothing further to do, and no effect on the vendor's score." },
  withdrawn: { title: 'Withdrawn by Vendor', caption: 'Disputes closed automatically because the vendor withdrew the invoice.' }
};
const viewToggle = createViewToggle({
  mountId: 'viewToggle', wrapId: 'viewWrap', tableId: 'list',
  views: [{ key: 'pending', label: 'Pending' }, { key: 'sent', label: 'Sent' }, { key: 'resolved', label: 'Resolved' },
          { key: 'accepted', label: 'Accepted' }, { key: 'withdrawn', label: 'Withdrawn' }],
  initial: 'pending',
  onSwap: () => { renderDisputes(); }
});

function renderDisputes() {
  const all = allDisputes;
  const pending = all.filter(c => c.status === 'pending_send' && !c.resolved);
  const sent = all.filter(c => c.status === 'sent' && !c.resolved);
  const resolved = all.filter(c => c.resolved && !c.closed_reason);
  const accepted = all.filter(c => c.closed_reason === 'payment' || c.closed_reason === 'verified' || c.closed_reason === 'reputation_only');
  const withdrawn = all.filter(c => c.closed_reason === 'withdrawn');
  viewToggle.setCounts({ pending: pending.length, sent: sent.length, resolved: resolved.length, accepted: accepted.length, withdrawn: withdrawn.length });
  // Never write cards while the list is fading out for a view switch.
  if (viewToggle.isSwapping()) return;
  const view = viewToggle.getView();
  document.getElementById('viewTitle').textContent = VIEW_INFO[view].title;
  document.getElementById('viewCaption').textContent = VIEW_INFO[view].caption;
  const list = document.getElementById('list');

  if (view === 'pending') setHtmlPreserving(list, pending.length
    ? pending.map(c => card(c, `
        <span class="hbg hbg-outline d-inline-block"><button class="hbg-core dispute-btn" onclick="withButtonState(this, () => saveEdit(${c.id}))">Save Edit</button></span>
        <span class="hbg d-inline-block"><button class="hbg-core dispute-btn" onclick="withButtonState(this, () => sendDispute(${c.id}))">Send to Vendor</button></span>`)).join('')
    : '<p class="text-muted small">Nothing pending — every flagged invoice has already had its dispute message sent.</p>');

  else if (view === 'sent') setHtmlPreserving(list, sent.length
    ? sent.map(c => card(c, `<span class="hbg d-inline-block"><button class="hbg-core dispute-btn" onclick="withButtonState(this, () => resolveDispute(${c.id}))">Mark Resolved</button></span>`)).join('')
    : '<p class="text-muted small">No open disputes waiting on the vendor right now.</p>');

  else if (view === 'resolved') setHtmlPreserving(list, resolved.length
    ? resolved.map(c => resolvedCard(c)).join('')
    : '<p class="text-muted small">No resolved disputes yet.</p>');

  else if (view === 'accepted') setHtmlPreserving(list, accepted.length
    ? accepted.map(c => closedCard(c, c.closed_reason === 'reputation_only' ? 'Flagged only by the vendor risk score — invoice itself was correct, no dispute needed.' : c.closed_reason === 'verified' ? 'Invoice was verified and auto-approved — dispute closed.' : 'Finance accepted — invoice paid, dispute closed.')).join('')
    : '<p class="text-muted small">None.</p>');

  else setHtmlPreserving(list, withdrawn.length
    ? withdrawn.map(c => closedCard(c, 'Vendor withdrew the invoice, dispute closed.')).join('')
    : '<p class="text-muted small">None.</p>');
}

getSortState = renderSortToolbar('sortToolbar', loadAll, {
  searchPlaceholder: 'Search by vendor, invoice, or requirement...',
  sortOptions: [
    { value: 'text:vendor_name', label: 'Vendor: A → Z' },
    { value: 'text:requirement_title', label: 'Requirement: A → Z' }
  ]
});
// Poll every second so a newly flagged invoice's dispute appears live, and the vendor's
// response shows up without a manual refresh. Rendering is non-destructive (unchanged
// data = no DOM change; typed text, focus and scroll position survive a refresh), so the
// only thing worth pausing for is an active text selection, which a rebuild would clear.
pollEvery(loadAll, 1000, () => hasSelectionWithin('list'));
</script>
</body>
</html>
