<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Registration — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container" style="max-width:480px;">
  <div class="card p-4 mb-4">
    <h4 class="mb-3">Company Registration</h4>
    <div id="error" class="alert alert-danger d-none"></div>
    <form id="form">
      <div class="mb-3"><label class="form-label">Your Name (becomes Company Admin)</label><input class="form-control" id="personName" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="password" required></div>
      <div class="mb-3"><label class="form-label">Company Name</label><input class="form-control" id="company_name" required></div>
      <div class="mb-3">
        <label class="form-label">GSTIN <span class="text-danger">*required</span></label>
        <input class="form-control" id="gstin" maxlength="15" placeholder="15 characters" required>
      </div>
      <div class="mb-3"><label class="form-label">Address <span class="text-danger">*required</span></label><input class="form-control" id="address" required></div>
      <div class="mb-3"><label class="form-label">Industry Type <span class="text-danger">*required</span></label><input class="form-control" id="industry_type" required></div>
      <div class="mb-3">
        <label class="form-label">Registration Proof <span class="text-danger">*required</span></label>
        <input type="file" class="form-control" id="proof" required>
        <p class="small text-muted mt-1">Certificate of incorporation, GST registration certificate, or similar — kept on file for Platform Admin oversight.</p>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register Company</button>
    </form>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('error');
  errorBox.classList.add('d-none');
  const proofFile = document.getElementById('proof').files[0];
  if (!proofFile) { errorBox.textContent = 'Registration proof document is required.'; errorBox.classList.remove('d-none'); return; }

  // NOTE: form fields are read via document.getElementById() explicitly, not bare
  // global identifiers — an input with id="name" would silently collide with the
  // browser's built-in window.name, causing the value to be lost. See personName below.
  const fd = new FormData();
  fd.append('name', document.getElementById('personName').value);
  fd.append('email', document.getElementById('email').value);
  fd.append('password', document.getElementById('password').value);
  fd.append('company_name', document.getElementById('company_name').value);
  fd.append('gstin', document.getElementById('gstin').value);
  fd.append('address', document.getElementById('address').value);
  fd.append('industry_type', document.getElementById('industry_type').value);
  fd.append('registration_proof', proofFile);

  const res = await fetch(`${API_BASE}/api/auth/register/company`, { method: 'POST', body: fd });
  const data = await res.json();
  if (!res.ok) { errorBox.textContent = data.error || 'Registration failed'; errorBox.classList.remove('d-none'); return; }
  setSession(data.token, data.user);
  window.location.href = '/company/awaiting-approval.html';
});
</script>
</body>
</html>
