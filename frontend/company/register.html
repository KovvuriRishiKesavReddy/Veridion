<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Registration — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container auth-container" style="max-width:520px;">
  <div class="card p-4 mb-4">
    <div class="auth-hero">
      <h4>Register Your Company</h4>
      <p>Set up your company's Veridion account in two quick steps</p>
    </div>

    <div class="step-indicator">
      <div class="step-item active" data-step-dot="1">
        <div class="step-circle"><span class="step-num">1</span><i class="bi bi-check-lg step-check d-none"></i></div>
        <div class="step-label">Details</div>
      </div>
      <div class="step-line" data-step-line="1"></div>
      <div class="step-item" data-step-dot="2">
        <div class="step-circle"><span class="step-num">2</span><i class="bi bi-check-lg step-check d-none"></i></div>
        <div class="step-label">Documents</div>
      </div>
    </div>

    <div id="error" class="alert alert-danger d-none"></div>

    <form id="form" novalidate>

      <!-- Step 1: Company & Admin Details -->
      <div class="step-panel" data-step="1">
        <div class="mb-3"><label class="form-label">Your Name (becomes Company Admin)</label><input class="form-control" id="personName" required></div>
        <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="auth-icon-field has-eye">
            <i class="bi bi-lock auth-field-icon"></i>
            <input type="password" class="form-control" id="password" required>
            <button type="button" class="auth-eye-toggle" id="togglePassword" aria-label="Show password"><i class="bi bi-eye-slash"></i></button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <div class="auth-icon-field has-eye">
            <i class="bi bi-lock auth-field-icon"></i>
            <input type="password" class="form-control" id="confirmPassword" required>
            <button type="button" class="auth-eye-toggle" id="toggleConfirmPassword" aria-label="Show password"><i class="bi bi-eye-slash"></i></button>
          </div>
        </div>
        <div class="mb-3"><label class="form-label">Company Name</label><input class="form-control" id="company_name" required></div>
        <div class="mb-3">
          <label class="form-label">GSTIN <span class="text-danger">*required</span></label>
          <input class="form-control" id="gstin" maxlength="15" placeholder="15 characters" required>
        </div>
        <div class="mb-3"><label class="form-label">Address <span class="text-danger">*required</span></label><input class="form-control" id="address" required></div>
        <div class="mb-3"><label class="form-label">Industry Type <span class="text-danger">*required</span></label><input class="form-control" id="industry_type" required></div>

        <div class="step-nav">
          <span class="hbg d-block"><button type="button" class="hbg-core w-100" onclick="nextStep(1)">Continue to Documents</button></span>
        </div>
      </div>

      <!-- Step 2: Document Upload -->
      <div class="step-panel d-none" data-step="2">
        <div class="mb-3">
          <label class="form-label">Registration Proof <span class="text-danger">*required</span></label>
          <input type="file" class="form-control" id="proof" required>
          <p class="small text-muted mt-1">Certificate of incorporation, GST registration certificate, or similar — kept on file for Platform Admin oversight.</p>
        </div>

        <div class="step-nav">
          <span class="hbg hbg-outline d-block"><button type="button" class="hbg-core w-100" onclick="goToStep(1)">Back</button></span>
          <span class="hbg d-block"><button type="submit" class="hbg-core w-100" id="submitBtn">Register Company</button></span>
        </div>
      </div>

    </form>
    <p class="text-muted small mt-3 mb-0 text-center">Already have an account? <a href="/login.html">Log in here</a>.</p>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
// Same show/hide pattern as login.html, wired up for both password fields.
function wireEyeToggle(inputId, buttonId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(buttonId);
  btn.addEventListener('click', () => {
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.innerHTML = showing ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });
}
wireEyeToggle('password', 'togglePassword');
wireEyeToggle('confirmPassword', 'toggleConfirmPassword');

// Confirm Password uses the browser's own required-field validation (already looped
// over by validateStep below) rather than a separate check — setCustomValidity makes
// checkValidity() fail and reportValidity() show the message natively, right on the
// field, the same way an empty required field would.
const passwordEl = document.getElementById('password');
const confirmPasswordEl = document.getElementById('confirmPassword');
function checkPasswordsMatch() {
  confirmPasswordEl.setCustomValidity(
    confirmPasswordEl.value && confirmPasswordEl.value !== passwordEl.value ? 'Passwords do not match' : ''
  );
}
passwordEl.addEventListener('input', checkPasswordsMatch);
confirmPasswordEl.addEventListener('input', checkPasswordsMatch);

function goToStep(n) {
  document.querySelectorAll('.step-panel').forEach(p => p.classList.toggle('d-none', Number(p.dataset.step) !== n));
  document.querySelectorAll('.step-item').forEach(item => {
    const dot = Number(item.dataset.stepDot);
    item.classList.toggle('active', dot === n);
    item.classList.toggle('done', dot < n);
    item.querySelector('.step-num').classList.toggle('d-none', dot < n);
    item.querySelector('.step-check').classList.toggle('d-none', dot >= n);
  });
  document.querySelectorAll('.step-line').forEach(line => {
    line.classList.toggle('done', Number(line.dataset.stepLine) < n);
  });
  document.getElementById('error').classList.add('d-none');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Validates only the fields inside the panel being left, so a required field
// on a later/earlier step never blocks moving between steps.
function validateStep(stepNum) {
  const panel = document.querySelector(`.step-panel[data-step="${stepNum}"]`);
  const fields = panel.querySelectorAll('[required]');
  for (const field of fields) {
    if (!field.checkValidity()) { field.reportValidity(); return false; }
  }
  return true;
}

function nextStep(fromStep) {
  if (!validateStep(fromStep)) return;
  goToStep(fromStep + 1);
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!validateStep(2)) return;
  const errorBox = document.getElementById('error');
  errorBox.classList.add('d-none');
  const proofFile = document.getElementById('proof').files[0];
  if (!proofFile) { errorBox.textContent = 'Registration proof document is required.'; errorBox.classList.remove('d-none'); return; }

  // NOTE: form fields are read via document.getElementById() explicitly, not bare
  // global identifiers — an input with id="name" would silently collide with the
  // browser's built-in window.name, causing the value to be lost. See personName below.
  const fd = new FormData();
  fd.append('name', document.getElementById('personName').value);
  fd.append('email', document.getElementById('email').value);
  fd.append('password', document.getElementById('password').value);
  fd.append('company_name', document.getElementById('company_name').value);
  fd.append('gstin', document.getElementById('gstin').value);
  fd.append('address', document.getElementById('address').value);
  fd.append('industry_type', document.getElementById('industry_type').value);
  fd.append('registration_proof', proofFile);

  const submitBtn = document.getElementById('submitBtn');
  await withButtonState(submitBtn, async () => {
    const res = await fetch(`${API_BASE}/api/auth/register/company`, { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) { errorBox.textContent = data.error || 'Registration failed'; errorBox.classList.remove('d-none'); return false; }
    setSession(data.token, data.user, true); // persist: just registered/accepted an invite, keep them signed in
    window.location.href = '/company/awaiting-approval.html';
    return null; // navigating away — no success flash needed
  });
});
</script>
</body>
</html>
