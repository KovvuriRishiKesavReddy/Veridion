<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Registration — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container" style="max-width:480px;">
  <div class="card p-4 mb-4">
    <h4 class="mb-3">Company Registration</h4>
    <div id="error" class="alert alert-danger d-none"></div>
    <form id="form">
      <div class="mb-3"><label class="form-label">Your Name (becomes Company Admin)</label><input class="form-control" id="name" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="password" required></div>
      <div class="mb-3"><label class="form-label">Company Name</label><input class="form-control" id="company_name" required></div>
      <div class="mb-3"><label class="form-label">GSTIN</label><input class="form-control" id="gstin"></div>
      <div class="mb-3"><label class="form-label">Address</label><input class="form-control" id="address"></div>
      <div class="mb-3"><label class="form-label">Industry Type</label><input class="form-control" id="industry_type"></div>
      <button type="submit" class="btn btn-primary w-100">Register Company</button>
    </form>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('error');
  errorBox.classList.add('d-none');
  const body = {
    name: name.value, email: email.value, password: password.value,
    company_name: company_name.value, gstin: gstin.value, address: address.value, industry_type: industry_type.value
  };
  const res = await fetch(`${API_BASE}/api/auth/register/company`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) { errorBox.textContent = data.error || 'Registration failed'; errorBox.classList.remove('d-none'); return; }
  setSession(data.token, data.user);
  window.location.href = '/company/dashboard.html';
});
</script>
</body>
</html>
