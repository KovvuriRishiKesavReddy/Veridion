<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-1">Payments</h3>
  <p class="text-muted">Payment can only be approved once the AI verification pipeline has auto-approved an invoice — that's a hard rule, not just a suggestion. Anything flagged needs review first.</p>
  <div id="sortToolbar"></div>

  <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
    <div>
      <h6 class="mb-0" id="viewTitle">Ready to Pay</h6>
      <div class="small text-muted" id="viewCaption"></div>
    </div>
    <div id="viewToggle"></div>
  </div>
  <div class="view-wrap" id="viewWrap">
  <table class="table table-centered bg-white mb-0 view-table" id="viewTable">
    <thead id="viewHead"></thead>
    <tbody id="viewRows"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
  </table>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script src="/shared/seg-toggle.js"></script>
<script>
const user = requireLogin(['finance']);
let getSortState = () => ({ sortBy: 'newest' });

let allInvs = [];   // every invoice (after the search/sort box), whatever tab is showing

// Ready to Pay = auto-approved and unpaid; Needs Review = unpaid but flagged / still being verified;
// Paid = done. Same sliding toggle and table swap as the Team page (shared/seg-toggle.js).
const link = i => `<a href="/company/invoice-review.html?id=${i.id}">${i.invoice_number || '#' + i.id}</a>`;
const VIEWS = {
  ready: {
    title: 'Ready to Pay', caption: 'Auto-approved by the AI pipeline — payment can be approved.',
    head: ['Invoice', 'Vendor', 'Requirement', 'Amount to Pay (incl. GST)', 'Confidence Score', 'Action'],
    empty: 'Nothing ready to pay right now.',
    row: i => [link(i), i.vendor_name, i.requirement_title, formatInvoiceTotal(i), i.final_score != null ? Number(i.final_score).toFixed(2) : '—',
      `<button class="btn btn-sm btn-amber" onclick="approvePay(${i.id})">Approve Payment</button>`]
  },
  review: {
    title: 'Needs Review Before Payment', caption: 'Flagged, or the AI verification is still running.',
    head: ['Invoice', 'Vendor', 'Requirement', 'Amount to Pay (incl. GST)', 'Why Flagged', 'Action'],
    empty: 'Nothing needs review right now.',
    row: i => [link(i), i.vendor_name, i.requirement_title, formatInvoiceTotal(i),
      `<span class="small">${i.final_decision ? `${i.final_decision} — see review page` : 'AI verification still running'}</span>`,
      `<a href="/company/invoice-review.html?id=${i.id}" class="btn btn-sm btn-outline-secondary">Review</a>`]
  },
  paid: {
    title: 'Already Paid', caption: 'Invoices Finance has paid.',
    head: ['Invoice', 'Vendor', 'Requirement', 'Amount Paid (incl. GST)', 'Submitted'],
    empty: 'No payments made yet.',
    row: i => [link(i), i.vendor_name, i.requirement_title, formatInvoiceTotal(i), new Date(i.submitted_at).toLocaleDateString()]
  }
};
const viewToggle = createViewToggle({
  mountId: 'viewToggle', wrapId: 'viewWrap', tableId: 'viewTable',
  views: [{ key: 'ready', label: 'Ready to Pay' }, { key: 'review', label: 'Needs Review' }, { key: 'paid', label: 'Paid' }],
  initial: 'ready',
  onSwap: () => { renderPayments(); }
});

async function load() {
  const res = await fetchWithAuth('/api/invoices/company');
  if (!res) return;
  let invs = await res.json();
  allInvs = sortAndFilterItems(invs, getSortState(), { dateField: 'submitted_at', numberField: 'id', searchFields: ['invoice_number', 'vendor_name', 'requirement_title'] });
  renderPayments();
}

function renderPayments() {
  const unpaid = allInvs.filter(i => i.status !== 'paid');
  const groups = {
    ready: unpaid.filter(i => i.final_decision === 'auto_approved'),
    review: unpaid.filter(i => i.final_decision !== 'auto_approved'),
    paid: allInvs.filter(i => i.status === 'paid')
  };
  viewToggle.setCounts({ ready: groups.ready.length, review: groups.review.length, paid: groups.paid.length });
  // Never write rows while the table is fading out for a view switch.
  if (viewToggle.isSwapping()) return;
  const view = viewToggle.getView(), v = VIEWS[view], list = groups[view];
  document.getElementById('viewTitle').textContent = v.title;
  document.getElementById('viewCaption').textContent = v.caption;
  document.getElementById('viewHead').innerHTML = '<tr>' + v.head.map(h => `<th>${h}</th>`).join('') + '</tr>';
  document.getElementById('viewRows').innerHTML = list.length
    ? list.map(i => '<tr>' + v.row(i).map(c => `<td>${c}</td>`).join('') + '</tr>').join('')
    : `<tr><td colspan="${v.head.length}" class="text-muted">${v.empty}</td></tr>`;
}

async function approvePay(id) {
  if (!confirm('Approve payment for this invoice?')) return;
  const res = await fetchWithAuth(`/api/invoices/${id}/mark-paid`, { method: 'POST' });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return; }
  load();
}

getSortState = renderSortToolbar('sortToolbar', load, {
  searchPlaceholder: 'Search by invoice, vendor, or requirement...',
  sortOptions: [
    { value: 'text:vendor_name', label: 'Vendor: A → Z' },
    { value: 'text:requirement_title', label: 'Requirement: A → Z' }
  ]
});
// Poll every second so an invoice moving between "ready to pay" and "flagged" (or a
// payment made in another tab) is reflected live.
pollEvery(load, 1000, () => pollBlockedBy('viewRows'));
</script>
</body>
</html>
