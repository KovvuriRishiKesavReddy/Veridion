<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Status — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container" style="max-width:520px; margin-top:60px;">
  <div class="card p-4 text-center" id="statusCard">
    <p class="text-muted">Checking your company's account status...</p>
  </div>
  <div class="text-center mt-3">
    <button class="btn btn-sm btn-outline-secondary" onclick="checkStatus()">Refresh Status</button>
    <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Log Out</button>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
// This page deliberately does NOT call requireLogin() with a role restriction that
// assumes full access — a pending/rejected company's users still have a valid session,
// they just shouldn't reach the real dashboard. We check status directly instead.
if (!getToken() || !getUser()) window.location.href = '/login.html';

async function checkStatus() {
  const res = await fetchWithAuth('/api/auth/me');
  if (!res) return;
  const me = await res.json();
  const card = document.getElementById('statusCard');

  if (me.company_approval_status === 'approved') {
    window.location.href = '/company/dashboard.html';
    return;
  }

  if (me.company_approval_status === 'rejected') {
    card.innerHTML = `
      <h4 class="text-danger">Registration Rejected</h4>
      <p class="text-muted">Your company's registration was not approved by the platform admin. Nobody on this account has access to the company dashboard.</p>
      <p class="small text-muted">If you believe this is a mistake, contact the platform administrator.</p>`;
    return;
  }

  // pending (default)
  card.innerHTML = `
    <h4 class="text-warning">Awaiting Approval</h4>
    <p class="text-muted">Thanks for registering, ${me.name}. A Platform Admin needs to verify your company's registration documents before anyone on your team can post requirements, invite teammates, accept quotations, record deliveries, or approve payments.</p>
    <p class="small text-muted">This page checks automatically every second — you'll be moved to your dashboard the moment you're approved, no need to refresh.</p>`;
}

// Poll every second so approval is picked up live, without a manual refresh.
pollEvery(checkStatus);
</script>
</body>
</html>
