<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform Admin — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-1">Vendor Verification</h3>
  <p class="text-muted">Every vendor that has registered on the platform. A vendor can't act on the platform (quote, invoice, etc.) until approved here — this is the human-gated step described in the onboarding flow.</p>
  <table class="table bg-white">
    <thead><tr><th>Company</th><th>Contact</th><th>Email</th><th>GSTIN</th><th>Status</th><th>Registered</th><th>Action</th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
  </table>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['platform_admin']);

async function load() {
  const res = await fetchWithAuth('/api/admin/vendors');
  if (!res) return;
  const vendors = await res.json();
  const rows = document.getElementById('rows');
  if (!vendors.length) { rows.innerHTML = '<tr><td colspan="7" class="text-muted">No vendors registered yet.</td></tr>'; return; }
  rows.innerHTML = vendors.map(v => `
    <tr>
      <td>${v.company_name}</td>
      <td>${v.contact_name}</td>
      <td>${v.email}</td>
      <td>${v.gstin || '—'}</td>
      <td><span class="badge status-badge ${statusBadgeClass(v.verification_status)}">${v.verification_status}</span></td>
      <td>${new Date(v.created_at).toLocaleDateString()}</td>
      <td>
        ${v.business_reg_proof_path ? `<button class="btn btn-sm btn-outline-secondary mb-1" onclick="viewProof(${v.id})">View Proof</button><br>` : '<span class="small text-muted d-block">No proof uploaded</span>'}
        ${v.verification_status === 'pending' ? `
          <button class="btn btn-sm btn-amber me-1" onclick="verify(${v.id}, 'verified')">Approve</button>
          <button class="btn btn-sm btn-outline-danger" onclick="verify(${v.id}, 'rejected')">Reject</button>
        ` : v.verification_status === 'verified' ? `
          <button class="btn btn-sm btn-outline-danger" onclick="verify(${v.id}, 'rejected')">Revoke</button>
        ` : `
          <button class="btn btn-sm btn-outline-secondary" onclick="verify(${v.id}, 'verified')">Re-approve</button>
        `}
      </td>
    </tr>`).join('');
}

async function viewProof(id) {
  const res = await fetchWithAuth(`/api/admin/vendors/${id}/proof-document`);
  if (!res || !res.ok) { alert('No proof document on file for this vendor.'); return; }
  const blob = await res.blob();
  window.open(URL.createObjectURL(blob), '_blank');
}

async function verify(id, status) {
  const res = await fetchWithAuth(`/api/admin/vendors/${id}/verify`, { method: 'POST', body: JSON.stringify({ status }) });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return; }
  load();
}

load();
</script>
</body>
</html>
