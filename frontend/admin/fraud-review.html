<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraud Review Queue — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-1">Fraud Review Queue</h3>
  <p class="text-muted">Invoices marked 'suspicious' by the Context Gate — a high-severity fraud signal (shell company, split billing) bypasses the normal weighted decision entirely and lands here for cross-company review.</p>
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6 class="mb-0">Fraud Flags</h6>
    <div id="viewToggle"></div>
  </div>
  <div class="view-wrap" id="viewWrap">
  <table class="table table-centered bg-white mb-0 view-table" id="viewTable">
    <thead><tr><th>Vendor</th><th>Invoice</th><th>Flag Type</th><th>Severity</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="fraudRows"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
  </table>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script src="/shared/dashboard-widgets.js"></script>
<script src="/shared/seg-toggle.js"></script>
<script>
requireLogin(['platform_admin']);

let allFlags = [];
let lastHtml = null;

// Pending (open flags that still need a decision) / Resolved. Same sliding toggle and table swap
// as the Team page (shared/seg-toggle.js).
const viewToggle = createViewToggle({
  mountId: 'viewToggle', wrapId: 'viewWrap', tableId: 'viewTable',
  views: [{ key: 'pending', label: 'Pending' }, { key: 'resolved', label: 'Resolved' }],
  initial: 'pending',
  onSwap: () => { lastHtml = null; renderFlags(); }
});

const EMPTY_MSG = {
  pending: 'No pending fraud flags. Anything raised by the Context Gate will appear here until you resolve it.',
  resolved: 'No resolved fraud flags yet.'
};

async function loadFraudFlags() {
  const res = await fetchWithAuth('/api/admin/fraud-flags');
  if (!res) return;
  allFlags = await res.json();
  renderFlags();
}

function renderFlags() {
  const pending = allFlags.filter(f => !f.resolved);
  const resolved = allFlags.filter(f => f.resolved);
  viewToggle.setCounts({ pending: pending.length, resolved: resolved.length });
  const view = viewToggle.getView();
  const flags = view === 'pending' ? pending : resolved;
  const html = flags.length ? flags.map(f => `
    <tr>
      <td>${f.vendor_name}</td>
      <td>${f.invoice_number ? escapeHtml(f.invoice_number) : (f.invoice_ref ? '#' + f.invoice_ref : '—')}${f.invoice_withdrawn ? ' <span class="badge bg-secondary ms-1">Withdrawn</span>' : ''}</td>
      <td>${f.flag_type}</td>
      <td><span class="badge ${f.severity === 'high' ? 'bg-danger' : f.severity === 'medium' ? 'bg-warning text-dark' : 'bg-secondary'}">${f.severity}</span></td>
      <td>${f.resolved ? '<span class="badge bg-success">Resolved</span>' : '<span class="badge bg-warning text-dark">Open</span>'}</td>
      <td>${!f.resolved ? `<button class="btn btn-sm btn-outline-secondary" onclick="resolveFlag(${f.id})">Mark Resolved</button>`
        : (!f.invoice_withdrawn && ['suspicious', 'flagged'].includes(f.invoice_status) ? `<button class="btn btn-sm btn-outline-secondary" title="Re-check this invoice's decision now that the flag is resolved" onclick="resolveFlag(${f.id})">Re-run decision</button>` : '—')}</td>
    </tr>`).join('') : `<tr><td colspan="6" class="text-muted">${EMPTY_MSG[view]}</td></tr>`;
  // Only touch the DOM when something changed, and never during the fade-out of a view switch.
  if (!viewToggle.isSwapping() && html !== lastHtml) { lastHtml = html; document.getElementById('fraudRows').innerHTML = html; }
}

async function resolveFlag(id) {
  const res = await fetchWithAuth(`/api/admin/fraud-flags/${id}/resolve`, { method: 'POST' });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return; }
  // Resolving re-runs the invoice's decision (in the background) once all of its flags are closed.
  const r = data.rerun;
  if (r && r.queued) {
    alert('Flag resolved. The invoice is being re-checked now — Finance will see the updated decision (and be notified) in a moment.');
  } else if (r && r.reason) {
    alert('Flag resolved. The decision was not re-run because ' + r.reason + '.');
  }
  loadFraudFlags();
}

pollEvery(loadFraudFlags, 1000, () => pollBlockedBy('fraudRows'));
</script>
</body>
</html>
