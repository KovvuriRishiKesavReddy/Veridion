<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Status — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container" style="max-width:520px; margin-top:60px;">
  <div class="card p-4 text-center" id="statusCard">
    <p class="text-muted">Checking your account status...</p>
  </div>
  <div class="text-center mt-3">
    <button class="btn btn-sm btn-outline-secondary" onclick="checkStatus()">Refresh Status</button>
    <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Log Out</button>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
// This page deliberately does NOT call requireLogin(['vendor']) with a role
// restriction that assumes full access — a pending/rejected vendor still has a
// valid session, they just shouldn't reach the real dashboard. We check status
// directly instead.
if (!getToken() || !getUser()) window.location.href = '/login.html';

async function checkStatus() {
  const res = await fetchWithAuth('/api/auth/me');
  if (!res) return;
  const me = await res.json();
  const card = document.getElementById('statusCard');

  if (me.vendor_verification_status === 'verified') {
    window.location.href = '/vendor/dashboard.html';
    return;
  }

  if (me.vendor_verification_status === 'rejected') {
    card.innerHTML = `
      <h4 class="text-danger">Registration Rejected</h4>
      <p class="text-muted">Your vendor registration was not approved by the platform admin. You do not have access to the vendor dashboard.</p>
      <p class="small text-muted">If you believe this is a mistake, contact the platform administrator.</p>`;
    return;
  }

  // pending (default)
  card.innerHTML = `
    <h4 class="text-warning">Awaiting Approval</h4>
    <p class="text-muted">Thanks for registering, ${me.name}. A Platform Admin needs to verify your business details before you can access the dashboard, browse requirements, or submit quotations.</p>
    <p class="small text-muted">This page will not update automatically — click Refresh Status after you've been notified, or check back later.</p>`;
}

checkStatus();
</script>
</body>
</html>
