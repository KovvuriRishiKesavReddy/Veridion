<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container" style="max-width:520px;">
  <div class="card p-4">
    <h4 class="mb-1">My Profile</h4>
    <p class="text-muted small">Company name, GSTIN, and PAN were verified by Platform Admin against your proof document and can't be self-edited here. Bank and address details can be updated any time — every change is re-checked against other vendors on the platform.</p>
    <div id="msg" class="alert d-none"></div>

    <div class="mb-3">
      <label class="form-label text-muted small">Company Name (verified)</label>
      <input class="form-control" id="company_name" disabled>
    </div>

    <form id="form">
      <div class="mb-3"><label class="form-label">Phone Number</label><input class="form-control" id="phone_number"></div>
      <div class="mb-3"><label class="form-label">Business Address</label><input class="form-control" id="address"></div>
      <div class="row">
        <div class="col mb-3"><label class="form-label">Bank Account Number</label><input class="form-control" id="bank_account_number"></div>
        <div class="col mb-3"><label class="form-label">IFSC Code</label><input class="form-control" id="bank_ifsc"></div>
      </div>
      <div class="mb-3">
        <label class="form-label">Preferred Notification Channel</label>
        <select class="form-select" id="preferred_notification_channel">
          <option value="sms">SMS</option>
          <option value="voice_call">Voice Call</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="app_only">App Only</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Save Changes</button>
    </form>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['vendor']);

async function load() {
  const res = await fetchWithAuth('/api/vendors/me');
  if (!res) return;
  const v = await res.json();
  document.getElementById('company_name').value = v.company_name;
  document.getElementById('phone_number').value = v.phone_number || '';
  document.getElementById('address').value = v.address || '';
  document.getElementById('bank_account_number').value = v.bank_account_number || '';
  document.getElementById('bank_ifsc').value = v.bank_ifsc || '';
  document.getElementById('preferred_notification_channel').value = v.preferred_notification_channel;
}
load();

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    phone_number: phone_number.value || null,
    address: address.value || null,
    bank_account_number: bank_account_number.value || null,
    bank_ifsc: bank_ifsc.value || null,
    preferred_notification_channel: preferred_notification_channel.value
  };
  const res = await fetchWithAuth('/api/vendors/me', { method: 'PUT', body: JSON.stringify(body) });
  if (!res) return;
  const data = await res.json();
  const box = document.getElementById('msg');
  box.classList.remove('d-none');
  if (!res.ok) { box.className = 'alert alert-danger'; box.textContent = data.error || 'Failed'; return; }
  box.className = 'alert alert-success';
  box.textContent = 'Profile updated.';
});
</script>
</body>
</html>
