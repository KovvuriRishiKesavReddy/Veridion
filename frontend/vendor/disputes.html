<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disputes — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-1">Invoice Disputes</h3>
  <p class="text-muted">Invoices the buyer's automated review flagged, with their explanation. You can respond directly below.</p>
  <div id="list"><p class="text-muted">Loading...</p></div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['vendor']);

function card(c) {
  const canRespond = c.status === 'sent' && !c.resolved;
  return `
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <strong>${c.company_name}</strong> — Invoice ${c.invoice_number || '#' + c.invoice_id} (₹${c.invoice_amount})
          <div class="text-muted small">${c.requirement_title}</div>
        </div>
        ${c.resolved ? '<span class="badge bg-success">Resolved</span>' : (c.status === 'sent' ? '<span class="badge bg-warning text-dark">Awaiting your response</span>' : '<span class="badge bg-secondary">Being reviewed internally</span>')}
      </div>
      ${c.status === 'sent' || c.resolved ? `<div class="alert alert-secondary mt-2 mb-0 small">${c.draft_text}</div>` : '<p class="small text-muted mt-2 mb-0">This invoice has been flagged and is being reviewed — you\'ll see the details here once it\'s sent to you.</p>'}
      ${c.vendor_response ? `<div class="mt-2 small"><strong>Your response</strong> (${new Date(c.vendor_responded_at).toLocaleString()}):<br>${c.vendor_response}</div>` : ''}
      ${canRespond ? `
      <div class="mt-2">
        <textarea class="form-control" id="resp-${c.id}" rows="2" placeholder="Explain or clarify...">${c.vendor_response || ''}</textarea>
        <button class="btn btn-sm btn-amber mt-2" onclick="respond(${c.id})">${c.vendor_response ? 'Update Response' : 'Send Response'}</button>
      </div>` : ''}
    </div>`;
}

async function respond(id) {
  const response = document.getElementById(`resp-${id}`).value;
  if (!response || !response.trim()) { alert('Please enter a response first.'); return; }
  const res = await fetchWithAuth(`/api/vendor-communications/${id}/respond`, { method: 'POST', body: JSON.stringify({ response }) });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return; }
  load();
}

async function load() {
  const res = await fetchWithAuth('/api/vendor-communications/mine');
  if (!res) return;
  const all = await res.json();
  const list = document.getElementById('list');
  list.innerHTML = all.length ? all.map(card).join('') : '<p class="text-muted">No disputes — nothing flagged on your invoices.</p>';
}

// Poll every second so a new dispute, or Finance's side of the conversation, shows up
// live. Skips a tick while you're actively typing a response, so a poll never
// overwrites it.
pollEvery(load, 1000, () => pollBlockedBy('list'));
</script>
</body>
</html>
