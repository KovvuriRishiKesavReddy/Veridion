<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disputes — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-1">Invoice Disputes</h3>
  <p class="text-muted">Invoices the buyer's automated review flagged, with their explanation. You can respond directly below.</p>
  <div id="sortToolbar"></div>
  <div id="list"><p class="text-muted">Loading...</p></div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['vendor']);
let getSortState = () => ({ sortBy: 'newest' });

function card(c) {
  const canRespond = c.status === 'sent' && !c.resolved;
  const thread = buildDisputeThread(c, 'You');
  return `
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <strong>${c.company_name}</strong> — Invoice ${c.invoice_number || '#' + c.invoice_id} (₹${c.invoice_amount ?? '—'})
          <div class="text-muted small">${c.requirement_title || ''}${c.invoice_withdrawn ? ' <span class="badge bg-secondary ms-1">Invoice Withdrawn</span>' : ''}</div>
        </div>
        ${c.resolved ? `<span class="badge bg-success">${c.closed_reason === 'payment' ? 'Closed — invoice accepted &amp; paid' : (c.closed_reason === 'verified' ? 'Closed — invoice approved' : c.closed_reason === 'withdrawn' ? 'Closed — invoice withdrawn' : 'Resolved')}</span>` : (c.status === 'sent' ? '<span class="badge bg-warning text-dark">Awaiting your response</span>' : '<span class="badge bg-secondary">Being reviewed internally</span>')}
      </div>
      ${c.status === 'sent' ? '' : '<p class="small text-muted mt-2 mb-0">This invoice has been flagged and is being reviewed — you\'ll see the details here once it\'s sent to you.</p>'}
      ${thread.length ? `
      <div class="mt-2">
        <label class="form-label small text-muted mb-1">Conversation</label>
        <div class="dispute-thread" data-scroll-key="thread-${c.id}">
          ${renderChatThread(thread, 'vendor')}
        </div>
      </div>` : ''}
      ${canRespond ? `
      <div class="mt-2">
        <textarea class="form-control" id="resp-${c.id}" rows="2" placeholder="Send a message..."></textarea>
      </div>
      <div class="dispute-actions mt-3">
        <span class="hbg d-inline-block"><button class="hbg-core dispute-btn" onclick="withButtonState(this, () => respond(${c.id}))">Send Message</button></span>
      </div>` : ''}
    </div>`;
}

async function respond(id) {
  const textarea = document.getElementById(`resp-${id}`);
  const response = textarea.value;
  if (!response || !response.trim()) { alert('Please enter a message first.'); return false; }
  const res = await fetchWithAuth(`/api/vendor-communications/${id}/respond`, { method: 'POST', body: JSON.stringify({ response }) });
  if (!res) return false;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return false; }
  textarea.value = ''; // each send is a new, separate message -- never left pre-filled
  load();
}

async function load() {
  const res = await fetchWithAuth('/api/vendor-communications/mine');
  if (!res) return;
  let all = await res.json();
  all = sortAndFilterItems(all, getSortState(), { dateField: 'created_at', numberField: 'id', searchFields: ['company_name', 'invoice_number', 'requirement_title'] });
  const list = document.getElementById('list');
  // setHtmlPreserving: no-op when nothing changed; otherwise keeps typed text, focus and
  // each conversation's scroll position (see shared/api.js).
  setHtmlPreserving(list, all.length ? all.map(card).join('') : '<p class="text-muted">No disputes — nothing flagged on your invoices.</p>');
}

getSortState = renderSortToolbar('sortToolbar', load, {
  searchPlaceholder: 'Search by company, invoice, or requirement...',
  sortOptions: [
    { value: 'text:company_name', label: 'Company: A → Z' },
    { value: 'text:requirement_title', label: 'Requirement: A → Z' }
  ]
});
// Poll every second so a new dispute, or Finance's side of the conversation, shows up
// live. Rendering is non-destructive (unchanged data = no DOM change; typed text, focus
// and scroll position survive a refresh), so the only thing worth pausing for is an
// active text selection, which a rebuild would clear.
pollEvery(load, 1000, () => hasSelectionWithin('list'));
</script>
</body>
</html>
