<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Status — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-1">Payment Status</h3>
  <p class="text-muted">Where each of your invoices stands — what our verification system decided, and whether payment has gone through.</p>
  <div id="sortToolbar"></div>
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6 class="mb-0">Invoices</h6>
    <div id="viewToggle"></div>
  </div>
  <div class="view-wrap" id="viewWrap">
    <div id="cards" class="row g-3 view-cards"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script src="/shared/seg-toggle.js"></script>
<script>
requireLogin(['vendor']);
let getSortState = () => ({ sortBy: 'newest' });
let allInvs = [];   // every invoice (after the search/sort box), whatever tab is showing

// Not Paid = everything still on its way to payment (verification pending, under review, approved and
// awaiting payment); Paid = payment completed. Same sliding toggle and swap as the Team page.
const viewToggle = createViewToggle({
  mountId: 'viewToggle', wrapId: 'viewWrap', tableId: 'cards',
  views: [{ key: 'notpaid', label: 'Not Paid' }, { key: 'paid', label: 'Paid' }],
  initial: 'notpaid',
  onSwap: () => { renderCards(); }
});
const EMPTY_MSG = {
  notpaid: 'Nothing waiting for payment.',
  paid: 'No payments completed yet.'
};

function decisionBadge(inv) {
  if (!inv.final_decision) return '<span class="badge bg-secondary">Verification pending</span>';
  if (inv.final_decision === 'auto_approved') return '<span class="badge bg-success">Approved by verification</span>';
  return `<span class="badge bg-danger">${inv.final_decision} — under review</span>`;
}

function paymentBadge(inv) {
  if (inv.status === 'paid') return '<span class="badge bg-success">Payment Completed</span>';
  if (inv.final_decision === 'auto_approved') return '<span class="badge bg-warning text-dark">Approved — payment pending</span>';
  return '<span class="badge bg-secondary">Not yet eligible for payment</span>';
}

async function load() {
  const res = await fetchWithAuth('/api/invoices/mine');
  if (!res) return;
  let invs = await res.json();
  allInvs = sortAndFilterItems(invs, getSortState(), { dateField: 'submitted_at', numberField: 'id', searchFields: ['invoice_number', 'requirement_title'] });
  renderCards();
}

function renderCards() {
  const paid = allInvs.filter(i => i.status === 'paid');
  const notPaid = allInvs.filter(i => i.status !== 'paid');
  viewToggle.setCounts({ notpaid: notPaid.length, paid: paid.length });
  // Never write cards while the grid is fading out for a view switch.
  if (viewToggle.isSwapping()) return;
  const view = viewToggle.getView();
  const invs = view === 'paid' ? paid : notPaid;
  const cards = document.getElementById('cards');
  if (!invs.length) { setHtmlPreserving(cards, `<p class="text-muted">${allInvs.length ? EMPTY_MSG[view] : 'No invoices submitted yet.'}</p>`); return; }

  setHtmlPreserving(cards, invs.map(i => {
    // A flag driven solely by the vendor's own track record — Matching, Compliance
    // and Fraud all came back clean on this exact invoice (decide.js's
    // flaggedSolelyByReputation) — has nothing wrong on the document itself to
    // correct. Showing "Withdraw & Resubmit" here would suggest something needs
    // fixing when it doesn't, so it's left out entirely for this case; a short
    // note explains what's actually happening instead.
    const isReputationOnly = i.decision_agent_inputs?.vendor_risk?.counted_as_positive_despite_flag === true;
    const canWithdraw = ['flagged', 'suspicious'].includes(i.final_decision) && i.status !== 'paid' && !isReputationOnly;
    return `
    <div class="col-md-6">
      <div class="card p-3">
        <h6 class="mb-1">${i.invoice_number || 'Invoice #' + i.id} — ${i.requirement_title}</h6>
        <p class="small text-muted mb-1">Amount: ${formatInvoiceTotal(i)} · Submitted: ${new Date(i.submitted_at).toLocaleDateString()}</p>
        <p class="small text-muted mb-2">Payment Due Date: ${i.due_date ? new Date(i.due_date).toLocaleDateString() : 'Not specified'}</p>
        <div class="mb-2">${decisionBadge(i)}</div>
        <div class="mb-2">${paymentBadge(i)}</div>
        ${i.decision_reasoning ? `<details class="small text-muted"><summary>Why this decision?</summary><p class="mt-1">${i.decision_reasoning}</p></details>` : ''}
        ${isReputationOnly ? `<p class="small text-muted mt-2 mb-0">This invoice itself is correct — it's under review based on account history, not anything on this document. No action is needed from you; your buyer's Finance team will review it.</p>` : ''}
        ${canWithdraw ? `<span class="hbg hbg-danger d-inline-block mt-2"><button class="hbg-core" style="padding:6px 14px;font-size:0.85rem;" onclick="withButtonState(this, () => withdrawInvoice(${i.id}))">Withdraw &amp; Resubmit Corrected Invoice</button></span>` : ''}
      </div>
    </div>`;
  }).join(''));
}

async function withdrawInvoice(id) {
  const ok = await confirmDialog({
    title: 'Withdraw this invoice?',
    message: 'You will need to fix the issue and resubmit a corrected invoice — this cannot be undone.',
    confirmText: 'Withdraw',
    danger: true
  });
  if (!ok) return null;
  const res = await fetchWithAuth(`/api/invoices/${id}`, { method: 'DELETE' });
  if (!res) return false;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return false; }
  load();
}

getSortState = renderSortToolbar('sortToolbar', load, {
  searchPlaceholder: 'Search by invoice or requirement...',
  sortOptions: [
    { value: 'text:requirement_title', label: 'Requirement: A → Z' }
  ]
});
// Poll every second so verification/payment status updates live, without a refresh.
pollEvery(load, 1000, () => pollBlockedBy('cards'));
</script>
</body>
</html>
