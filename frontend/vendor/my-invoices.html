<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Invoices — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>My Invoices</h3>
    <button class="btn btn-amber" data-bs-toggle="modal" data-bs-target="#uploadModal">Upload Invoice</button>
  </div>
  <table class="table bg-white">
    <thead><tr><th>Invoice #</th><th>PO</th><th>Amount</th><th>GST</th><th>Status</th><th>Submitted</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
  </table>
</div>

<div class="modal fade" id="uploadModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Upload Invoice</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Purchase Order</label>
          <select class="form-select" id="po_id"></select>
        </div>
        <div class="mb-3"><label class="form-label">Invoice Number</label><input class="form-control" id="invoice_number"></div>
        <div class="mb-3"><label class="form-label">Invoice Amount (₹)</label><input type="number" step="0.01" class="form-control" id="invoice_amount" required></div>
        <div class="mb-3"><label class="form-label">GST Amount (₹)</label><input type="number" step="0.01" class="form-control" id="gst_amount"></div>
        <div class="mb-3"><label class="form-label">GSTIN on Invoice</label><input class="form-control" id="gstin_on_invoice"></div>
        <div class="mb-3"><label class="form-label">Due Date</label><input type="date" class="form-control" id="due_date"></div>
        <div class="mb-3"><label class="form-label">Invoice File</label><input type="file" class="form-control" id="invoice_file"></div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="submitInvoice()">Upload</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['vendor']);

async function loadInvoices() {
  const res = await fetchWithAuth('/api/invoices/mine');
  if (!res) return;
  const invs = await res.json();
  const rows = document.getElementById('rows');
  if (!invs.length) { rows.innerHTML = '<tr><td colspan="6" class="text-muted">No invoices yet.</td></tr>'; return; }
  rows.innerHTML = invs.map(i => `
    <tr>
      <td>${i.invoice_number || '—'}</td>
      <td>#${i.po_id}</td>
      <td>₹${i.invoice_amount}</td>
      <td>₹${i.gst_amount || 0}</td>
      <td><span class="badge status-badge ${statusBadgeClass(i.status)}">${i.status}</span></td>
      <td>${new Date(i.submitted_at).toLocaleDateString()}</td>
    </tr>`).join('');
}

async function loadPoOptions() {
  const res = await fetchWithAuth('/api/purchase-orders/mine');
  if (!res) return;
  const pos = await res.json();
  document.getElementById('po_id').innerHTML = pos.map(po => `<option value="${po.id}">PO #${po.id} — ₹${po.agreed_price} (${po.fulfillment_status})</option>`).join('');
}

loadInvoices();
loadPoOptions();

async function submitInvoice() {
  const fd = new FormData();
  fd.append('po_id', document.getElementById('po_id').value);
  fd.append('invoice_number', document.getElementById('invoice_number').value);
  fd.append('invoice_amount', document.getElementById('invoice_amount').value);
  fd.append('gst_amount', document.getElementById('gst_amount').value);
  fd.append('gstin_on_invoice', document.getElementById('gstin_on_invoice').value);
  fd.append('due_date', document.getElementById('due_date').value);
  const file = document.getElementById('invoice_file').files[0];
  if (file) fd.append('invoice_file', file);

  const res = await fetchWithAuth('/api/invoices', { method: 'POST', body: fd });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return; }
  bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
  loadInvoices();
}
</script>
</body>
</html>
