<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Quotations — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-4">My Quotations</h3>
  <div id="sortToolbar"></div>
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6 class="mb-0">Quotations</h6>
    <div id="viewToggle"></div>
  </div>
  <div class="view-wrap" id="viewWrap">
  <table class="table table-centered bg-white mb-0 view-table" id="viewTable">
    <thead><tr><th>Requirement</th><th>Price</th><th>Delivery (days)</th><th>Status</th><th>Submitted</th><th>Message</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
  </table>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script src="/shared/seg-toggle.js"></script>
<script>
requireLogin(['vendor']);
let getSortState = () => ({ sortBy: 'newest' });
let lastQs = [];   // every quotation (after the search/sort box), whatever tab is showing

// "Submitted" = still awaiting the buyer's decision, so it stays visible (it is where Message /
// price edits live); decided quotations are split into Selected / Rejected. Same sliding toggle and
// table swap as the Team page (shared/seg-toggle.js).
const viewToggle = createViewToggle({
  mountId: 'viewToggle', wrapId: 'viewWrap', tableId: 'viewTable',
  views: [{ key: 'submitted', label: 'Submitted' }, { key: 'selected', label: 'Selected' }, { key: 'rejected', label: 'Rejected' }],
  initial: 'submitted',
  onSwap: () => { renderQuotations(); }
});

const EMPTY_MSG = {
  submitted: 'No quotations awaiting a decision.',
  selected: 'No selected quotations yet. Quotations the buyer accepts will appear here.',
  rejected: 'No rejected quotations.'
};

async function load() {
  const res = await fetchWithAuth('/api/quotations/mine');
  if (!res) return;
  let qs = await res.json();
  lastQs = sortAndFilterItems(qs, getSortState(), { dateField: 'submitted_at', numberField: 'id', searchFields: ['requirement_title'] });
  renderQuotations();
}

function renderQuotations() {
  const counts = { submitted: 0, selected: 0, rejected: 0 };
  lastQs.forEach(q => { if (counts[q.status] !== undefined) counts[q.status]++; });
  viewToggle.setCounts(counts);
  // Never write rows while the table is fading out for a view switch.
  if (viewToggle.isSwapping()) return;
  const view = viewToggle.getView();
  const qs = lastQs.filter(q => q.status === view);
  const rows = document.getElementById('rows');
  if (!qs.length) { setHtmlPreserving(rows, `<tr><td colspan="6" class="text-muted">${lastQs.length ? EMPTY_MSG[view] : 'No quotations yet.'}</td></tr>`); return; }
  setHtmlPreserving(rows, qs.map(q => `
    <tr>
      <td>${q.requirement_title}</td>
      <td>₹${q.price}</td>
      <td>${q.delivery_days}</td>
      <td><span class="badge status-badge ${statusBadgeClass(q.status)}">${q.status}</span></td>
      <td>${new Date(q.submitted_at).toLocaleDateString()}</td>
      <td>${q.status === 'submitted'
        ? `<button class="btn btn-sm btn-message" onclick="openQuotationThread(${q.id})">Message</button>`
        : `<button class="btn btn-sm btn-outline-secondary" onclick="openQuotationThread(${q.id})">History</button>`}</td>
    </tr>`).join(''));
}

// Pre-award negotiation with Procurement, private to this one quotation (other vendors who
// quoted on the same requirement never see it). While the quotation is still awaiting a
// decision the vendor can also change their own price / delivery days from the dialog; once
// it is accepted or rejected the thread is read-only history.
function openQuotationThread(id) {
  const q0 = lastQs.find(x => x.id === id);
  openThreadModal({
    title: `Quotation — ${q0 ? q0.requirement_title : '#' + id}`,
    subtitle: 'Private conversation with the buyer about price and delivery',
    listUrl: `/api/quotation-messages/${id}`,
    postUrl: `/api/quotation-messages/${id}`,
    viewerRole: 'vendor',
    closedNote: 'This quotation has been decided — the negotiation window is closed, history stays visible.',
    // Live terms: if the quotation is no longer 'submitted' it counts as closed.
    getTerms: () => { const q = lastQs.find(x => x.id === id); return q && q.status === 'submitted' ? { price: q.price, delivery_days: q.delivery_days } : null; },
    propose: { mode: 'update', putUrl: `/api/quotations/${id}`, onUpdated: () => load() }
  });
}
getSortState = renderSortToolbar('sortToolbar', load, {
  searchPlaceholder: 'Search by requirement...',
  sortOptions: [
    { value: 'text:requirement_title', label: 'Requirement: A → Z' }
  ]
});
// Poll every second so a quotation moving to accepted/rejected shows up live.
pollEvery(load, 1000, () => pollBlockedBy('rows'));
</script>
</body>
</html>
