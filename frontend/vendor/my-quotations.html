<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Quotations — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-4">My Quotations</h3>
  <div id="sortToolbar"></div>
  <table class="table table-centered bg-white">
    <thead><tr><th>Requirement</th><th>Price</th><th>Delivery (days)</th><th>Status</th><th>Submitted</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="text-muted">Loading...</td></tr></tbody>
  </table>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['vendor']);
let getSortState = () => ({ sortBy: 'newest' });
async function load() {
  const res = await fetchWithAuth('/api/quotations/mine');
  if (!res) return;
  let qs = await res.json();
  qs = sortAndFilterItems(qs, getSortState(), { dateField: 'submitted_at', numberField: 'id', searchFields: ['requirement_title'] });
  const rows = document.getElementById('rows');
  if (!qs.length) { rows.innerHTML = '<tr><td colspan="5" class="text-muted">No quotations yet.</td></tr>'; return; }
  rows.innerHTML = qs.map(q => `
    <tr>
      <td>${q.requirement_title}</td>
      <td>₹${q.price}</td>
      <td>${q.delivery_days}</td>
      <td><span class="badge status-badge ${statusBadgeClass(q.status)}">${q.status}</span></td>
      <td>${new Date(q.submitted_at).toLocaleDateString()}</td>
    </tr>`).join('');
}
getSortState = renderSortToolbar('sortToolbar', load, {
  searchPlaceholder: 'Search by requirement...',
  sortOptions: [
    { value: 'text:requirement_title', label: 'Requirement: A → Z' }
  ]
});
// Poll every second so a quotation moving to accepted/rejected shows up live.
pollEvery(load, 1000, () => pollBlockedBy('rows'));
</script>
</body>
</html>
