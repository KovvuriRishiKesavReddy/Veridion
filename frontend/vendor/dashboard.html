<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Dashboard — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-4">Welcome, <span id="vendorName"></span></h3>
  <div class="row g-3">
    <div class="col-md-4"><div class="card p-3 text-center"><h6>Open Requirements</h6><a href="/vendor/requirements.html" class="btn btn-amber btn-sm mt-2">Browse</a></div></div>
    <div class="col-md-4"><div class="card p-3 text-center"><h6>My Quotations</h6><a href="/vendor/my-quotations.html" class="btn btn-amber btn-sm mt-2">View</a></div></div>
    <div class="col-md-4"><div class="card p-3 text-center"><h6>My Invoices</h6><a href="/vendor/my-invoices.html" class="btn btn-amber btn-sm mt-2">View</a></div></div>
  </div>

  <h5 class="mt-5">Accepted Purchase Orders</h5>
  <table class="table table-sm bg-white">
    <thead><tr><th>PO #</th><th>Price</th><th>Quantity</th><th>Delivery Date</th><th>Status</th><th>Fulfillment</th><th>Document</th></tr></thead>
    <tbody id="poRows"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
  </table>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
const user = requireLogin(['vendor']);
document.getElementById('vendorName').textContent = user ? user.name : '';

(async () => {
  const res = await fetchWithAuth('/api/purchase-orders/mine');
  if (!res) return;
  const pos = await res.json();
  const rows = document.getElementById('poRows');
  if (!pos.length) { rows.innerHTML = '<tr><td colspan="7" class="text-muted">No purchase orders yet.</td></tr>'; return; }
  rows.innerHTML = pos.map(po => `
    <tr>
      <td>#${po.id}</td>
      <td>₹${po.agreed_price}</td>
      <td>${po.agreed_quantity}</td>
      <td>${po.agreed_delivery_date || '—'}</td>
      <td><span class="badge status-badge ${statusBadgeClass(po.status)}">${po.status}</span></td>
      <td><span class="badge status-badge ${statusBadgeClass(po.fulfillment_status)}">${po.fulfillment_status}</span></td>
      <td>${po.po_document_path ? `<a href="#" onclick="downloadPo(${po.id});return false;">PDF</a>` : '—'}</td>
    </tr>`).join('');
})();

async function downloadPo(id) {
  const res = await fetchWithAuth(`/api/purchase-orders/${id}/document`);
  if (!res || !res.ok) { alert('Could not fetch document'); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}
</script>
</body>
</html>
