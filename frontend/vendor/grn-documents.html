<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery / GRN Records — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-1">Delivery Records (GRNs)</h3>
  <p class="text-muted">Every confirmed goods receipt against your purchase orders — this is how much of each order has actually been received so far, as recorded by the buyer's warehouse.</p>
  <div id="sortToolbar"></div>
  <table class="table table-centered bg-white">
    <thead><tr><th>PO</th><th>Company</th><th>Received Qty / Agreed Qty</th><th>Received Date</th><th>Fulfillment</th><th>Next Expected</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
  </table>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['vendor']);
let getSortState = () => ({ sortBy: 'newest' });
async function load() {
  const res = await fetchWithAuth('/api/grn/vendor');
  if (!res) return;
  let grns = await res.json();
  grns = sortAndFilterItems(grns, getSortState(), { dateField: 'received_date', numberField: 'id', searchFields: ['requirement_title', 'company_name'] });
  const rows = document.getElementById('rows');
  if (!grns.length) { rows.innerHTML = '<tr><td colspan="6" class="text-muted">No deliveries recorded yet.</td></tr>'; return; }
  rows.innerHTML = grns.map(g => `
    <tr>
      <td>#${g.po_id} — ${g.requirement_title}</td>
      <td>${g.company_name}</td>
      <td>${g.cumulative_received} / ${g.agreed_quantity}${varianceBadge(g.variance_quantity)}<div class="small text-muted">this delivery: ${g.received_quantity}</div></td>
      <td>${g.received_date}</td>
      <td><span class="badge status-badge ${statusBadgeClass(g.fulfillment_status)}">${g.fulfillment_status}</span></td>
      <td>${g.expected_next_delivery_date || '—'}</td>
    </tr>`).join('');
}
getSortState = renderSortToolbar('sortToolbar', load, {
  searchPlaceholder: 'Search by requirement or company...',
  sortOptions: [
    { value: 'text:requirement_title', label: 'Requirement: A → Z' },
    { value: 'text:company_name', label: 'Company: A → Z' }
  ]
});
// Poll every second so a new delivery recorded by the buyer's warehouse shows up live.
pollEvery(load, 1000, () => pollBlockedBy('rows'));
</script>
</body>
</html>
