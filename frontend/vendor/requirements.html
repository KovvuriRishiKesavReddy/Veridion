<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Requirements — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container">
  <h3 class="mb-4">Open Requirements</h3>

  <div class="filter-toolbar mb-3">
    <div class="d-flex flex-wrap gap-3 align-items-end">
      <div class="flex-grow-1" style="min-width:220px;">
        <label class="form-label small text-muted mb-1">Search</label>
        <input class="form-control form-control-sm" id="searchFilter" placeholder="Search by title, category, or company...">
      </div>
      <div style="min-width:180px;">
        <label class="form-label small text-muted mb-1">Sort by</label>
        <select class="form-select form-select-sm" id="sortBy">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="deadline">Deadline: soonest</option>
          <option value="title_asc">Title: A &rarr; Z</option>
          <option value="company_asc">Company: A &rarr; Z</option>
        </select>
      </div>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="clearFilters">Clear</button>
    </div>
  </div>

  <div id="list" class="row g-3"></div>
</div>

<!-- Quote Modal -->
<div class="modal fade" id="quoteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Submit Quotation</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="requirement_id">
        <div class="mb-3"><label class="form-label">Price (total, ₹)</label><input type="number" step="0.01" class="form-control" id="price" required></div>
        <div class="mb-3"><label class="form-label">Delivery (days)</label><input type="number" class="form-control" id="delivery_days" required></div>
        <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" id="notes"></textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="submitQuote()">Submit</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
requireLogin(['vendor']);
let quoteModal;

// Full unfiltered list from the server, kept as-is; every filter/sort control below
// operates on this in memory so combining "cement" + "BrightBuild" + a title search
// all narrow the same list together, instead of each control fighting over a
// server-side query param (which is how this used to silently only support one
// category filter, case-sensitive, with no company/title search and no sort at all).
let allReqs = [];

document.addEventListener('DOMContentLoaded', () => {
  quoteModal = new bootstrap.Modal(document.getElementById('quoteModal'));

  const searchEl = document.getElementById('searchFilter');
  const sortEl = document.getElementById('sortBy');
  const clearBtn = document.getElementById('clearFilters');

  searchEl.addEventListener('input', render);
  sortEl.addEventListener('change', render);
  clearBtn.addEventListener('click', () => {
    searchEl.value = ''; sortEl.value = 'newest';
    render();
  });

  // Poll every second so newly posted requirements show up live. Safe alongside the
  // filter/sort controls — load() only refreshes the underlying data, render() (which
  // reads the controls' current values) does the actual filtering/sorting/drawing, so
  // nothing here resets what the vendor has typed or selected.
  pollEvery(load, 1000, () => pollBlockedBy('list'));
});

async function load() {
  const res = await fetchWithAuth('/api/requirements');
  if (!res) return;
  allReqs = await res.json();
  render();
}

function render() {
  const search = document.getElementById('searchFilter').value.trim().toLowerCase();
  const sortBy = document.getElementById('sortBy').value;

  let reqs = allReqs.filter(r => {
    if (!search) return true;
    return (r.title || '').toLowerCase().includes(search)
      || (r.category || '').toLowerCase().includes(search)
      || (r.company_name || '').toLowerCase().includes(search);
  });

  reqs = reqs.slice().sort((a, b) => {
    switch (sortBy) {
      case 'oldest': return new Date(a.created_at || 0) - new Date(b.created_at || 0);
      case 'deadline': return new Date(a.deadline || '9999-12-31') - new Date(b.deadline || '9999-12-31');
      case 'title_asc': return (a.title || '').localeCompare(b.title || '');
      case 'company_asc': return (a.company_name || '').localeCompare(b.company_name || '');
      case 'newest': default: return new Date(b.created_at || 0) - new Date(a.created_at || 0);
    }
  });

  const list = document.getElementById('list');

  if (!reqs.length) {
    list.innerHTML = `<p class="text-muted">${allReqs.length ? 'No requirements match your filters.' : 'No open requirements.'}</p>`;
    return;
  }
  list.innerHTML = reqs.map(r => `
    <div class="col-md-6">
      <div class="card p-3">
        <h6>${r.title} <span class="badge bg-light text-dark">${r.category || 'uncategorized'}</span></h6>
        <p class="small text-muted mb-1">${r.company_name}</p>
        <p class="mb-1">${r.description || ''}</p>
        <p class="small mb-2">Qty: ${r.quantity} ${r.unit || ''} · Deadline: ${r.deadline || 'N/A'}</p>
        <button class="btn btn-amber btn-sm" onclick="openQuoteModal(${r.id})">Submit Quotation</button>
      </div>
    </div>`).join('');
}

function openQuoteModal(id) {
  document.getElementById('requirement_id').value = id;
  document.getElementById('price').value = '';
  document.getElementById('delivery_days').value = '';
  document.getElementById('notes').value = '';
  quoteModal.show();
}

async function submitQuote() {
  const body = {
    requirement_id: document.getElementById('requirement_id').value,
    price: document.getElementById('price').value,
    delivery_days: document.getElementById('delivery_days').value,
    notes: document.getElementById('notes').value
  };
  const res = await fetchWithAuth('/api/quotations', { method: 'POST', body: JSON.stringify(body) });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return; }
  quoteModal.hide();
  load();
}
</script>
</body>
</html>
