<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veridion — Log in</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container auth-container auth-rounded login-page">
  <div class="card p-4">
    <div class="auth-hero">
      <h4>Welcome to Veridion</h4>
      <p>Sign in to your Veridion account</p>
    </div>
    <div id="error" class="alert alert-danger d-none"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="auth-icon-field">
          <i class="bi bi-envelope auth-field-icon"></i>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="auth-icon-field has-eye">
          <i class="bi bi-lock auth-field-icon"></i>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
          <button type="button" class="auth-eye-toggle" id="togglePassword" aria-label="Show password"><i class="bi bi-eye-slash"></i></button>
        </div>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Remember me on this device</label>
      </div>
      <span class="hbg d-block"><button type="submit" class="hbg-core w-100" id="loginBtn">Sign In</button></span>
    </form>
    <div class="auth-signup text-center">
      <p class="text-muted mb-2">Don't have an account?</p>
      <a href="/vendor/register.html" class="auth-link auth-signup-link">Sign up as vendor</a>
      <a href="/company/register.html" class="auth-link auth-signup-link">Sign up as company</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
const passwordInput = document.getElementById('password');
const toggleBtn = document.getElementById('togglePassword');
toggleBtn.addEventListener('click', () => {
  const showing = passwordInput.type === 'text';
  passwordInput.type = showing ? 'password' : 'text';
  toggleBtn.innerHTML = showing ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
  toggleBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loginBtn = document.getElementById('loginBtn');
  await withButtonState(loginBtn, async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('error');
    errorBox.classList.add('d-none');

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { errorBox.textContent = data.error || 'Login failed'; errorBox.classList.remove('d-none'); return false; }
      const remember = document.getElementById('rememberMe').checked;
      setSession(data.token, data.user, remember);
      const dest = {
        vendor: data.user.vendor_verification_status === 'verified' ? '/vendor/dashboard.html' : '/vendor/awaiting-approval.html',
        company_admin: '/company/dashboard.html',
        procurement: '/company/dashboard.html',
        finance: '/company/dashboard.html',
        warehouse: '/company/dashboard.html',
        platform_admin: '/admin/dashboard.html'
      }[data.user.role] || '/login.html';
      window.location.href = dest;
      return null; // navigating away — no success flash needed, the redirect IS the feedback
    } catch (err) {
      errorBox.textContent = 'Could not reach the server — is the backend running on ' + API_BASE + '?';
      errorBox.classList.remove('d-none');
      return false;
    }
  });
});
</script>
</body>
</html>
