<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accept Invite — Veridion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/shared/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-root"></div>
<div class="container auth-container" style="max-width:420px;">
  <div class="card p-4">
    <h4 class="mb-3">Accept Team Invitation</h4>
    <div id="error" class="alert alert-danger d-none"></div>
    <form id="form">
      <div class="mb-3"><label class="form-label">Your Name</label><input class="form-control" id="name" required></div>
      <div class="mb-3">
        <label class="form-label">Set a Password</label>
        <div class="auth-icon-field has-eye">
          <i class="bi bi-lock auth-field-icon"></i>
          <input type="password" class="form-control" id="password" required>
          <button type="button" class="auth-eye-toggle" id="togglePassword" aria-label="Show password"><i class="bi bi-eye-slash"></i></button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <div class="auth-icon-field has-eye">
          <i class="bi bi-lock auth-field-icon"></i>
          <input type="password" class="form-control" id="confirmPassword" required>
          <button type="button" class="auth-eye-toggle" id="toggleConfirmPassword" aria-label="Show password"><i class="bi bi-eye-slash"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Accept & Join</button>
    </form>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/navbar.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
wireEyeToggle('password', 'togglePassword');
wireEyeToggle('confirmPassword', 'toggleConfirmPassword');
// Same policy as vendor/company registration (see shared/api.js) — 8+ characters,
// one uppercase letter, one special character — and Confirm Password stays disabled
// until it's met. This form has no `novalidate`, so the browser's own constraint
// validation (which respects the setCustomValidity calls inside this) blocks
// submission on its own; no extra JS check is needed here.
wirePasswordStrength('password', 'confirmPassword');

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('error');
  errorBox.classList.add('d-none');
  const res = await fetch(`${API_BASE}/api/auth/accept-invite/${token}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: document.getElementById('name').value, password: document.getElementById('password').value })
  });
  const data = await res.json();
  if (!res.ok) { errorBox.textContent = data.error || 'Could not accept invite'; errorBox.classList.remove('d-none'); return; }
  setSession(data.token, data.user, true); // persist: just registered/accepted an invite, keep them signed in
  window.location.href = '/company/dashboard.html';
});
</script>
</body>
</html>
